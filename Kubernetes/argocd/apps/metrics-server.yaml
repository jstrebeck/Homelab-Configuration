---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://github.com/jstrebeck/Homelab-Configuration.git
    targetRevision: main
    path: Kubernetes/metrics-server
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
