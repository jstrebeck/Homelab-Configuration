---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph
      targetRevision: v1.18.8
      helm:
        releaseName: rook-ceph
        valueFiles:
          - $values/Kubernetes/ceph-rook/values-operator.yaml
    - repoURL: https://github.com/jstrebeck/Homelab-Configuration.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph-cluster
      targetRevision: v1.18.8
      helm:
        releaseName: rook-ceph-cluster
        valueFiles:
          - $values/Kubernetes/ceph-rook/values-cluster.yaml
    - repoURL: https://github.com/jstrebeck/Homelab-Configuration.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
