# App of apps. The only manifest applied by hand (see README.md); everything
# else under apps/ is created and kept in sync by this Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jstrebeck/Homelab-Configuration.git
    targetRevision: main
    path: Kubernetes/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
