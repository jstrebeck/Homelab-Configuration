# Values for the rook-ceph-cluster chart (https://charts.rook.io/release).
# Otherwise chart defaults: 3 mons, 2 mgrs, OSDs on every node's empty disks,
# and the ceph-block (default StorageClass), ceph-filesystem and
# ceph-objectstore pools.
operatorNamespace: rook-ceph

cephClusterSpec:
  mgr:
    # The chart's default is an empty key, which renders as null and fails
    # schema validation. Same meaning: no extra mgr modules.
    modules: []

  # CPU requests sized down from the chart defaults (500m-1000m per daemon) for
  # a 4-node homelab; memory is unchanged.
  resources:
    mgr:
      limits: { memory: "1Gi" }
      requests: { cpu: "100m", memory: "512Mi" }
    mon:
      limits: { memory: "2Gi" }
      requests: { cpu: "100m", memory: "1Gi" }
    osd:
      limits: { memory: "4Gi" }
      requests: { cpu: "100m", memory: "4Gi" }
    prepareosd:
      requests: { cpu: "100m", memory: "50Mi" }
    mgr-sidecar:
      limits: { memory: "100Mi" }
      requests: { cpu: "50m", memory: "40Mi" }
    crashcollector:
      limits: { memory: "60Mi" }
      requests: { cpu: "50m", memory: "60Mi" }
    logcollector:
      limits: { memory: "1Gi" }
      requests: { cpu: "50m", memory: "100Mi" }
    cleanup:
      limits: { memory: "1Gi" }
      requests: { cpu: "100m", memory: "100Mi" }
    exporter:
      limits: { memory: "128Mi" }
      requests: { cpu: "50m", memory: "50Mi" }
