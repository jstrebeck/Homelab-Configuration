# Values for the rook-ceph-cluster chart (https://charts.rook.io/release).
# Otherwise chart defaults: 3 mons, 2 mgrs, OSDs on every node's empty disks,
# and the ceph-block (default StorageClass), ceph-filesystem and
# ceph-objectstore pools.
operatorNamespace: rook-ceph

# Ceph mgr and exporter metrics scraped by kube-prometheus-stack, plus Rook's
# Ceph alert rules. Dashboards: ../grafana/dashboards/.
monitoring:
  enabled: true
  createPrometheusRules: true

# Ceph image. Since Rook v1.19 the chart sets cephClusterSpec.cephVersion from
# these values, so don't set cephVersion below. Pinned rather than following the
# chart default so a Rook upgrade never changes Ceph in the same step.
cephImage:
  repository: quay.io/ceph/ceph
  tag: v19.2.7

cephClusterSpec:
  # CVE-2025-30156: rotate the core daemon keys (mon, mgr, OSD, and the MDS
  # and RGW daemons of the filesystem and object store) to the AES256K type.
  # Raise keyGeneration to rotate again. CSI keys stay on aes (the chart
  # default) because AES256K kernel mounts need Linux 7.0+ and Talos 1.11
  # runs 6.12. See README.md.
  security:
    cephx:
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2

  # Warnings Ceph raises while any client key is still aes. CSI keys must stay
  # aes until the nodes run kernel 7.0+, so mute them rather than live with a
  # permanent HEALTH_WARN; unmute after migrating CSI keys to aes256k.
  healthCheck:
    muteHealthWarning:
      AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute

  mgr:
    # The chart's default is an empty key, which renders as null and fails
    # schema validation. Same meaning: no extra mgr modules.
    modules: []

  # CPU requests sized down from the chart defaults (500m-1000m per daemon) for
  # a 4-node homelab; memory is unchanged.
  resources:
    mgr:
      limits: { memory: "1Gi" }
      requests: { cpu: "100m", memory: "512Mi" }
    mon:
      limits: { memory: "2Gi" }
      requests: { cpu: "100m", memory: "1Gi" }
    osd:
      limits: { memory: "4Gi" }
      requests: { cpu: "100m", memory: "4Gi" }
    prepareosd:
      requests: { cpu: "100m", memory: "50Mi" }
    mgr-sidecar:
      limits: { memory: "100Mi" }
      requests: { cpu: "50m", memory: "40Mi" }
    crashcollector:
      limits: { memory: "60Mi" }
      requests: { cpu: "50m", memory: "60Mi" }
    logcollector:
      limits: { memory: "1Gi" }
      requests: { cpu: "50m", memory: "100Mi" }
    cleanup:
      limits: { memory: "1Gi" }
      requests: { cpu: "100m", memory: "100Mi" }
    exporter:
      limits: { memory: "128Mi" }
      requests: { cpu: "50m", memory: "50Mi" }
