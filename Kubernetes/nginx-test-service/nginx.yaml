apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-metallb-test
  labels:
    app: nginx-metallb-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-metallb-test
  template:
    metadata:
      labels:
        app: nginx-metallb-test
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-metallb-test
spec:
  type: LoadBalancer
  selector:
    app: nginx-metallb-test
  ports:
  - name: http
    port: 80
    targetPort: 80
