name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: Render and validate Argo CD apps
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBE_VERSION: 1.34.1
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Install tools
        run: |
          pip install --quiet pyyaml
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render every Application
        run: python scripts/render-apps.py --out rendered --kube-version "$KUBE_VERSION"

      # Custom resources are checked against the CRDs this repo actually deploys
      # (same chart versions), falling back to the community catalog for CRDs
      # that come from elsewhere. The catalog alone lags new CRD fields.
      - name: Generate schemas from the rendered CRDs
        run: |
          mkdir schemas && cd schemas
          curl -sSLO "https://raw.githubusercontent.com/yannh/kubeconform/${KUBECONFORM_VERSION}/scripts/openapi2jsonschema.py"
          FILENAME_FORMAT='{kind}-{fullgroup}-{version}' python openapi2jsonschema.py ../rendered/*.yaml > /dev/null
          rm openapi2jsonschema.py
          ls | wc -l

      - name: Validate against Kubernetes and CRD schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version "$KUBE_VERSION" \
            -schema-location default \
            -schema-location 'schemas/{{.ResourceKind}}-{{.Group}}-{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml

  terraform:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff Terraform

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks git . --redact --verbose
